[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmwiki"
version = "0.1.0"
description = "Model-agnostic, engineering-grade RAG / Knowledge & Retrieval layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
zmwiki = "zmwiki.tui.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional retro terminal UI. The default install stays dependency-free.
tui = ["textual>=8.2.8,<9"]
# Phase 11 Semantic Retrieval Profile: real semantic embeddings behind the
# existing EmbeddingProvider contract. Optional and isolated -- never pulled by
# a default install and never added to the dev extra, so CI/test stay ML-free.
# sentence-transformers is chosen over fastembed because its stable API can be
# implemented correctly offline (same entry point for model id and local path);
# fastembed remains a possible lighter alternative.
semantic = ["sentence-transformers>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
